name: 'stac-check-action'
description: 'Validate local STAC catalogs with rustac'
author: 'lowlydba'
branding:
  icon: 'globe'
  color: 'green'

inputs:
  rustac-version:
    description: 'rustac PyPI package version, not the embedded CLI version'
    default: '0.9.17'
  file:
    description: 'Path to local STAC file to validate'
    required: true
  recursive:
    description: 'Recursively validate related local STAC objects'
    required: false
    default: 'false'
  max-depth:
    description: 'Maximum traversal depth, with root at zero (requires recursive: true)'
    required: false
    default: ''
  validate-assets:
    description: 'Validate assets locally (no network requests)'
    required: false
    default: 'false'
  verbose:
    description: 'Show verbose error messages'
    required: false
    default: 'false'
  output-file:
    description: 'Save validation log to file'
    required: false
    default: ''
  job-summary:
    description: 'Write validation results to GitHub job summary'
    required: false
    default: 'true'
  comment-pr:
    description: 'Post validation summary as PR comment (requires pull-requests: write)'
    required: false
    default: 'false'
  extra-args:
    description: 'Additional rustac verbosity flags only: --verbose/-v and --quiet/-q'
    required: false
    default: ''
  stream-output:
    description: 'Stream wrapper progress and errors as validation runs'
    required: false
    default: 'true'

outputs:
  exit-code:
    description: 'Aggregate validation status: 0 for success, 1 for validation or operational errors'
    value: ${{ steps.run.outputs.exit-code }}
  log-path:
    description: 'Validation log path, including early input errors. verbose includes raw rustac diagnostics.'
    value: ${{ steps.run.outputs.log-path }}
  valid:
    description: 'Authoritative result for the objects checked; remote targets outside the local catalog are skipped with a warning.'
    value: ${{ steps.run.outputs.valid }}
  report-path:
    description: 'JSON report with counts and file-attributed errors'
    value: ${{ steps.run.outputs.report-path }}
  summary-path:
    description: 'Markdown summary used for the job summary and PR comment'
    value: ${{ steps.run.outputs.summary-path }}

runs:
  using: 'composite'
  steps:
    - name: Install validator
      shell: bash
      env:
        VERSION: ${{ inputs.rustac-version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        python -m pip install --quiet -r "$ACTION_PATH/requirements.txt"
        if [ "$VERSION" = "latest" ]; then
          python -m pip install --quiet rustac
        else
          VERSION="${VERSION#v}"
          python -m pip install --quiet "rustac==${VERSION}"
        fi

    - name: Validate STAC
      id: run
      shell: bash
      env:
        IN_FILE: ${{ inputs.file }}
        IN_RECURSIVE: ${{ inputs.recursive }}
        IN_MAX_DEPTH: ${{ inputs.max-depth }}
        IN_VALIDATE_ASSETS: ${{ inputs.validate-assets }}
        IN_VERBOSE: ${{ inputs.verbose }}
        IN_OUTPUT_FILE: ${{ inputs.output-file }}
        IN_EXTRA_ARGS: ${{ inputs.extra-args }}
        IN_STREAM_OUTPUT: ${{ inputs.stream-output }}
        ACTION_PATH: ${{ github.action_path }}
      run: python "$ACTION_PATH/scripts/run.py"

    - name: Write to job summary
      if: ${{ always() && inputs.job-summary == 'true' && steps.run.outputs.summary-path != '' }}
      shell: bash
      env:
        SUMMARY_PATH: ${{ steps.run.outputs.summary-path }}
      run: |
        set -euo pipefail
        cat "$SUMMARY_PATH" >> "$GITHUB_STEP_SUMMARY"

    - name: Post PR comment
      if: ${{ always() && inputs.comment-pr == 'true' && github.event_name == 'pull_request' && steps.run.outputs.summary-path != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SUMMARY_PATH: ${{ steps.run.outputs.summary-path }}
        PR_NUMBER: ${{ github.event.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        MARKER="<!-- stac-check-action -->"
        BODY_PATH="$RUNNER_TEMP/stac-check-comment.md"
        {
          echo "$MARKER"
          cat "$SUMMARY_PATH"
        } > "$BODY_PATH"

        COMMENT_ID=$(gh api --paginate --slurp "repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --jq "[.[][] | select((.body // \"\") | startswith(\"$MARKER\"))][0].id // empty")

        if [ -n "$COMMENT_ID" ]; then
          gh api --method PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" \
            --field "body=@${BODY_PATH}"
        else
          gh pr comment "$PR_NUMBER" --body-file "$BODY_PATH"
        fi

    - name: Fail on issues
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        VALID: ${{ steps.run.outputs.valid }}
        RUN_OUTCOME: ${{ steps.run.outcome }}
      run: |
        if [ -z "${EXIT_CODE}" ]; then
          if [ "${RUN_OUTCOME}" = "failure" ]; then
            echo "::error::STAC validator runner failed; see prior step output"
            exit 1
          fi
          echo "::error::internal: run step produced no exit-code output"
          exit 1
        fi
        if [ "${EXIT_CODE}" != "0" ]; then
          echo "::error::STAC validation exited with code: ${EXIT_CODE}"
          exit "${EXIT_CODE}"
        fi
        if [ "${VALID:-true}" = "false" ]; then
          echo "::error::STAC validation reported failures"
          exit 1
        fi
