name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.14']
        os: [ubuntu-latest]
        include:
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt rustac==0.9.17

      - name: Unit tests
        run: python -m coverage run --branch --source=scripts -m unittest discover -s tests -p "test_*.py"

      - name: Enforce coverage
        run: python -m coverage report --fail-under=95 --show-missing

      - name: Real rustac integration tests
        env:
          RUN_INTEGRATION: '1'
        run: python -m unittest discover -s tests -p test_integration.py -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate action.yml
        run: |
          python3 -m pip install -r requirements-test.txt
          python3 -c "
          import yaml
          with open('action.yml') as f:
              data = yaml.safe_load(f)
          print('action.yml valid')
          "

      - name: Check LF line endings
        run: |
          ! grep -rI --exclude-dir=.git $'\r' --include='*.yml' --include='*.yaml' --include='*.md' . || (echo 'CRLF detected'; exit 1)

  lint-actions:
    name: GitHub Actions audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          persona: pedantic

  e2e:
    name: Composite action reports and failure handling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Generate deterministic catalog
        run: python tests/generate_catalog.py "${RUNNER_TEMP}/stac-catalog"

      - name: Run stac-check-action (self)
        uses: $/
        id: e2e
        with:
          file: ${{ runner.temp }}/stac-catalog/catalog.json
          recursive: true
          validate-assets: true

      - name: Verify complete catalog and reports
        shell: bash
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          E2E_VALID: ${{ steps.e2e.outputs.valid }}
          E2E_EXIT_CODE: ${{ steps.e2e.outputs.exit-code }}
          E2E_OUTPUT_PATH: ${{ steps.e2e.outputs.log-path }}
          E2E_REPORT_PATH: ${{ steps.e2e.outputs.report-path }}
          E2E_SUMMARY_PATH: ${{ steps.e2e.outputs.summary-path }}
        run: |
          set -uo pipefail
          FAIL=0
          if [ "${E2E_OUTCOME}" != "success" ]; then
            echo "::error::E2E action step outcome was '${E2E_OUTCOME}', expected 'success'"
            FAIL=1
          fi
          if [ "${E2E_VALID}" != "true" ]; then
            echo "::error::E2E valid output was '${E2E_VALID}', expected 'true'"
            FAIL=1
          fi
          if [ "${E2E_EXIT_CODE}" != "0" ]; then
            echo "::error::E2E exit-code was '${E2E_EXIT_CODE}', expected '0'"
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "::group::Validation output"
            [ -f "${E2E_OUTPUT_PATH}" ] && cat "${E2E_OUTPUT_PATH}" || echo "(output file missing)"
            echo "::endgroup::"
            exit 1
          fi
          echo "E2E confirmed conforming STAC (outcome=success, valid=true, exit-code=0)"
          python -c '
          import json, os
          from pathlib import Path
          r = json.loads(Path(os.environ["E2E_REPORT_PATH"]).read_text())
          assert r["valid"] and r["items"] == 1000 and r["objects"] == 1002, r
          assert r["skipped_remote"] == 0 and r["cli_calls"] == 3, r
          assert "Passed" in Path(os.environ["E2E_SUMMARY_PATH"]).read_text()
          '

      - name: Invalid object fails but publishes results
        id: invalid
        continue-on-error: true
        uses: $/
        with:
          file: ${{ runner.temp }}/stac-catalog/invalid.json

      - name: Verify failure outputs
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
          VALID: ${{ steps.invalid.outputs.valid }}
          CODE: ${{ steps.invalid.outputs.exit-code }}
          SUMMARY: ${{ steps.invalid.outputs.summary-path }}
        run: |
          test "$OUTCOME" = failure
          test "$VALID" = false
          test "$CODE" = 1
          grep -q 'invalid.json' "$SUMMARY"

  overture-e2e:
    name: Released Overture generator against public data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Restore Overture generator binary
        id: overture-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/overture-tools/bin
          key: overture-stac-4.0.0-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install Overture generator
        shell: bash
        env:
          CACHE_HIT: ${{ steps.overture-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$CACHE_HIT" = "true" ]; then
            echo "Using cached Overture generator binary."
          else
            echo "Compiling published overture-stac 4.0.0 (cold binary cache)."
            cargo install --locked overture-stac --version 4.0.0 --root "${RUNNER_TEMP}/overture-tools"
          fi
          "${RUNNER_TEMP}/overture-tools/bin/overture-stac" --version

      - name: Cache installed Overture generator binary
        if: steps.overture-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/overture-tools/bin
          key: ${{ steps.overture-cache.outputs.cache-primary-key }}

      - name: Generate Overture catalog
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/overture-tools/bin/overture-stac" build \
            --debug --output "${RUNNER_TEMP}/overture-catalog"

      - name: Validate generated Overture catalog
        id: overture
        uses: $/
        with:
          file: ${{ runner.temp }}/overture-catalog/catalog.json
          recursive: true
          validate-assets: true

      - name: Verify complete local traversal and reports
        shell: bash
        env:
          VALID: ${{ steps.overture.outputs.valid }}
          CODE: ${{ steps.overture.outputs.exit-code }}
          REPORT: ${{ steps.overture.outputs.report-path }}
          SUMMARY: ${{ steps.overture.outputs.summary-path }}
        run: |
          set -euo pipefail
          test "$VALID" = true
          test "$CODE" = 0
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "overture-catalog"
          documents = [json.loads(path.read_text()) for path in root.rglob("*.json")]
          report = json.loads(Path(os.environ["REPORT"]).read_text())
          assert report["valid"] and not report["errors"], report
          assert report["objects"] == len(documents), report
          assert report["items"] == sum(doc.get("type") == "Feature" for doc in documents), report
          assert report["items"] > 0 and report["collections"] > 0 and report["catalogs"] > 0, report
          assert "Passed" in Path(os.environ["SUMMARY"]).read_text()
          PY

  rollup-tests:
    name: Test Rollup
    runs-on: ubuntu-latest
    permissions: {}
    needs: [test, lint, lint-actions, e2e, overture-e2e]
    if: always()
    steps:
      - uses: lowlydba/are-we-good@6b10e5f2697555fbaf7f8f37ce38d4454c954a4c # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
