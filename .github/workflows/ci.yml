name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install stac-check
        run: pip install stac-check==1.9.1

      - name: Create test STAC item
        run: |
          cat > "${RUNNER_TEMP}/test-item.json" << 'EOF'
          {
            "type": "Feature",
            "stac_version": "1.0.0",
            "stac_extensions": [],
            "id": "test-item",
            "geometry": {"type": "Point", "coordinates": [0, 0]},
            "bbox": [0, 0, 0, 0],
            "properties": {"datetime": "2024-01-01T00:00:00Z"},
            "links": [{"rel": "self", "href": "test-item.json"}],
            "assets": {}
          }
          EOF

      - name: Run stac-check
        run: stac-check "${RUNNER_TEMP}/test-item.json"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate action.yml
        run: |
          python3 -c "
          import yaml
          with open('action.yml') as f:
              data = yaml.safe_load(f)
          print('action.yml valid')
          "

      - name: Check LF line endings
        run: |
          ! grep -rI --exclude-dir=.git $'\r' --include='*.yml' --include='*.yaml' --include='*.md' . || (echo 'CRLF detected'; exit 1)

  lint-actions:
    name: GitHub Actions audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          persona: pedantic

  e2e:
    name: E2E Test with Overture STAC (positive)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stac-check-action
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Clone and setup overturemaps/stac
        run: |
          git clone --depth 1 https://github.com/OvertureMaps/stac.git "${RUNNER_TEMP}/overture-stac"
          cd "${RUNNER_TEMP}/overture-stac"
          uv sync

      - name: Generate STAC catalog
        run: |
          cd "${RUNNER_TEMP}/overture-stac"
          uv run gen-stac --output "${RUNNER_TEMP}/stac-catalog" --debug

      - name: Run stac-check-action (self)
        uses: ./stac-check-action
        id: e2e
        with:
          stac-check-version: 1.9.1
          file: ${{ runner.temp }}/stac-catalog/catalog.json
          recursive: true
          validate-assets: true

      - name: Verify stac-check passed cleanly
        shell: bash
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          E2E_VALID: ${{ steps.e2e.outputs.valid }}
          E2E_EXIT_CODE: ${{ steps.e2e.outputs.exit-code }}
          E2E_OUTPUT_PATH: ${{ steps.e2e.outputs.log-path }}
        run: |
          set -uo pipefail
          FAIL=0
          if [ "${E2E_OUTCOME}" != "success" ]; then
            echo "::error::E2E action step outcome was '${E2E_OUTCOME}', expected 'success' (Overture STAC should be conforming)"
            FAIL=1
          fi
          if [ "${E2E_VALID}" != "true" ]; then
            echo "::error::E2E valid output was '${E2E_VALID}', expected 'true' (overture STAC is conforming)"
            FAIL=1
          fi
          if [ "${E2E_EXIT_CODE}" != "0" ]; then
            echo "::error::E2E exit-code was '${E2E_EXIT_CODE}', expected '0'"
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "::group::stac-check output"
            [ -f "${E2E_OUTPUT_PATH}" ] && cat "${E2E_OUTPUT_PATH}" || echo "(output file missing)"
            echo "::endgroup::"
            exit 1
          fi
          echo "E2E confirmed conforming STAC (outcome=success, valid=true, exit-code=0)"

  bats:
    name: BATS Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run BATS tests
        run: npx -y bats@1.13.0 tests/

  rollup-tests:
    name: Test Rollup
    runs-on: ubuntu-latest
    permissions: {}
    needs: [test, lint, lint-actions, e2e, bats]
    if: always()
    steps:
      - uses: lowlydba/are-we-good@f506ed6324f55ec5e4ff5d92204a72c7f1c2b4f8 # v1.0.5
        with:
          jobs: ${{ toJSON(needs) }}
